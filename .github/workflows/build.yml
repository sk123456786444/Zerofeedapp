name: Build PWA to APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Package via PWABuilder
        run: |
          npx @pwabuilder/cli generate --manifest ./public/manifest.json --name "ZeroFeed" --platform android --output ./apk-output
        continue-on-error: true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk-release
          path: ./apk-output/
          
