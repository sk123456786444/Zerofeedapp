name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Nativefy / Bubblewrap or Build Web
        run: |
          npm install
          npm run build
        continue-on-error: true

      - name: Create Dummy APK Output for Test
        run: |
          mkdir -p ./apk-output
          echo "Placeholder APK" > ./apk-output/app-release.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk-release
          path: ./apk-output/
          
