name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build wrapper APK
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          mkdir wrapper && cd wrapper
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          mkdir www && echo '<html></html>' > www/index.html
          cat > capacitor.config.json <<EOF
          {"appId":"com.zerofeed.app","appName":"ZeroFeed","webDir":"www","server":{"url":"$APP_URL"}}
          EOF
          npx cap add android
          npx cap sync android
          cat >> android/app/build.gradle <<'EOF'
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroFeed-apk
          path: wrapper/android/app/build/outputs/apk/debug/app-debug.apk
